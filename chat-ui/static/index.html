<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterworks AI</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<style>
:root {
  --color-background-primary:   #ffffff;
  --color-background-secondary: #f4f4f5;
  --color-background-tertiary:  #e4e4e7;
  --color-text-primary:         #18181b;
  --color-text-secondary:       #71717a;
  --color-border-tertiary:      #d4d4d8;
  --color-accent:               #2563eb;
  --color-accent-hover:         #1d4ed8;
  --color-user-bubble:          #2563eb;
  --color-user-text:            #ffffff;
  --color-code-bg:              #f0f0f0;
  --color-pre-bg:               #f4f4f4;
  --color-pre-border:           #e0e0e0;
  --color-table-th:             #f4f4f4;
  --color-table-border:         #ddd;
  --color-tool-bg:              #fafafa;
  --color-tool-border:          #e8e8e8;
  --color-tool-name:            #2563eb;
  --color-tool-result:          #71717a;
  --color-ok:                   #16a34a;
  --color-error:                #dc2626;
  --color-warn:                 #d97706;
  --color-thinking-bg:          #fefce8;
  --color-thinking-border:      #fde68a;
  --color-thinking-text:        #78350f;
  --color-thinking-hdr:         #fef9c3;
  --radius:                     10px;
  --font-mono:                  "Cascadia Code", "Fira Code", "Consolas", monospace;
  --font-sans:                  system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary:   #09090b;
    --color-background-secondary: #18181b;
    --color-background-tertiary:  #27272a;
    --color-text-primary:         #fafafa;
    --color-text-secondary:       #a1a1aa;
    --color-border-tertiary:      #3f3f46;
    --color-accent:               #3b82f6;
    --color-accent-hover:         #60a5fa;
    --color-user-bubble:          #1d4ed8;
    --color-code-bg:              #27272a;
    --color-pre-bg:               #1e1e1e;
    --color-pre-border:           #3f3f46;
    --color-table-th:             #27272a;
    --color-table-border:         #3f3f46;
    --color-tool-bg:              #18181b;
    --color-tool-border:          #3f3f46;
    --color-tool-name:            #60a5fa;
    --color-tool-result:          #a1a1aa;
    --color-ok:                   #4ade80;
    --color-error:                #f87171;
    --color-warn:                 #fbbf24;
    --color-thinking-bg:          #1c1a0a;
    --color-thinking-border:      #3a3010;
    --color-thinking-text:        #c8a32a;
    --color-thinking-hdr:         #221f08;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  flex-shrink: 0;
}
header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; flex: 1; }
#header-logo { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; }
@media (prefers-color-scheme: dark) { #header-logo { content: url("/static/icon-dark.png"); } }
#model-select {
  font-size: 12px; padding: 4px 8px;
  border: 1px solid var(--color-border-tertiary); border-radius: 6px;
  background: var(--color-background-primary); color: var(--color-text-primary);
  cursor: pointer; max-width: 220px;
}

/* ── Main layout ── */
main { display: flex; flex: 1; min-height: 0; }

/* ── Chat pane ── */
#chat-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#messages {
  flex: 1; overflow-y: auto; padding: 20px 16px;
  display: flex; flex-direction: column; gap: 16px;
}

/* ── Messages ── */
.message { display: flex; flex-direction: column; max-width: 80%; gap: 4px; }
.message.user      { align-self: flex-end;   align-items: flex-end; }
.message.assistant { align-self: flex-start; align-items: flex-start; }

.bubble {
  padding: 10px 14px; border-radius: var(--radius);
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.message.user .bubble {
  background: var(--color-user-bubble); color: var(--color-user-text);
  border-bottom-right-radius: 3px;
  white-space: pre-wrap;
}
.message.assistant .bubble {
  background: var(--color-background-secondary);
  border: 1px solid var(--color-border-tertiary);
  border-bottom-left-radius: 3px;
}

/* Typing indicator */
.typing-dot {
  display: inline-block; width: 6px; height: 6px;
  background: var(--color-text-secondary); border-radius: 50%; margin: 0 1px;
  animation: blink 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

/* ── Markdown ── */
.bubble p  { margin-bottom: 0.6em; }
.bubble p:last-child { margin-bottom: 0; }
.bubble strong { font-weight: 600; }
.bubble em { font-style: italic; }
.bubble code {
  font-family: var(--font-mono); font-size: 12px;
  background: var(--color-code-bg); padding: 1px 5px; border-radius: 4px;
}
.message.user .bubble code { background: rgba(255,255,255,0.2); }
.bubble pre {
  background: var(--color-pre-bg); border: 1px solid var(--color-pre-border);
  border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 6px 0;
}
.bubble pre code { background: none; padding: 0; font-size: 12px; }
.bubble ul, .bubble ol { padding-left: 1.4em; margin: 0.4em 0; }
.bubble li { margin-bottom: 0.2em; }
.bubble h1,.bubble h2,.bubble h3 { font-weight: 600; margin: 0.6em 0 0.3em; line-height: 1.3; }
.bubble h1 { font-size: 1.15em; }
.bubble h2 { font-size: 1.05em; }
.bubble h3 { font-size: 0.98em; }
.bubble hr { border: none; border-top: 1px solid var(--color-border-tertiary); margin: 8px 0; }
.bubble table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; }
.bubble th, .bubble td { border: 1px solid var(--color-table-border); padding: 5px 9px; text-align: left; }
.bubble th { background: var(--color-table-th); font-weight: 600; }

/* ── Tool strip ── */
.tool-strip {
  display: none; align-items: center; gap: 6px;
  font-size: 12px; color: var(--color-text-secondary);
  cursor: pointer; padding: 3px 0; user-select: none;
  font-family: var(--font-mono);
}
.tool-strip:hover { color: var(--color-text-primary); }
.tool-strip .chevron { font-size: 10px; transition: transform 0.15s; }
.tool-strip.open .chevron { transform: rotate(90deg); }

.tool-detail-block {
  display: none;
  background: var(--color-tool-bg); border: 1px solid var(--color-tool-border);
  border-radius: 8px; padding: 8px 10px;
  font-family: var(--font-mono); font-size: 11.5px;
  white-space: pre-wrap; word-break: break-all;
  max-height: 260px; overflow-y: auto; width: 100%;
}
.tool-detail-block.open { display: block; }
.tool-call-item { margin-bottom: 8px; }
.tool-call-item:last-child { margin-bottom: 0; }
.tool-name  { color: var(--color-tool-name); font-weight: 600; }
.tool-result-text { color: var(--color-tool-result); margin-top: 3px; display: block; }

/* ── Input area ── */
#input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
}
#input-row { display: flex; gap: 8px; }
#user-input {
  flex: 1; resize: none; padding: 9px 12px;
  font-family: var(--font-sans); font-size: 14px;
  border: 1px solid var(--color-border-tertiary); border-radius: var(--radius);
  background: var(--color-background-primary); color: var(--color-text-primary);
  line-height: 1.5; min-height: 42px; max-height: 160px; overflow-y: auto;
}
#user-input:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; }
#send-btn {
  padding: 9px 18px; background: var(--color-accent); color: #fff;
  border: none; border-radius: var(--radius); font-size: 14px;
  font-weight: 600; cursor: pointer; white-space: nowrap; align-self: flex-end;
}
#send-btn:hover:not(:disabled) { background: var(--color-accent-hover); }
#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
#send-btn.stop-mode { background: #b91c1c; }
#send-btn.stop-mode:hover { background: #991b1b; }

/* ── Fault controls ── */
#fault-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#fault-row label { font-size: 11px; color: var(--color-text-secondary); }
#fault-target, #fault-mode {
  font-size: 11px; padding: 3px 7px;
  border: 1px solid var(--color-border-tertiary); border-radius: 5px;
  background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer;
}
.fault-btn {
  font-size: 11px; padding: 3px 10px;
  border: 1px solid var(--color-border-tertiary); border-radius: 5px;
  background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer;
}
.fault-btn:hover { background: var(--color-background-tertiary); }
.fault-btn.danger { border-color: var(--color-error); color: var(--color-error); }

/* ── Sidebar ── */
#sidebar {
  width: 220px; border-left: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary); padding: 14px 12px;
  display: flex; flex-direction: column; gap: 16px;
  overflow-y: auto; flex-shrink: 0;
}
.sidebar-section { display: flex; flex-direction: column; gap: 6px; }
.sidebar-section h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--color-text-secondary); font-weight: 600;
}
.health-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--color-background-tertiary); flex-shrink: 0;
  transition: background 0.3s;
}
.dot.ok    { background: var(--color-ok); }
.dot.error { background: var(--color-error); }

.status-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 0; border-bottom: 1px solid var(--color-border-tertiary);
  font-size: 12px;
}
.status-row:last-child { border-bottom: none; }
.status-name { font-family: var(--font-mono); font-size: 11px; }
.status-mode {
  font-family: var(--font-mono); font-size: 10px; padding: 1px 5px;
  border-radius: 3px; background: var(--color-background-tertiary);
}
.status-mode.fault { background: #fef3c7; color: #92400e; }
@media (prefers-color-scheme: dark) { .status-mode.fault { background: #2d1d02; color: #fbbf24; } }

@media (max-width: 700px) { #sidebar { display: none; } }

/* ── Thinking block ── */
.thinking-block {
  background: var(--color-thinking-bg); border: 1px solid var(--color-thinking-border);
  border-radius: 8px; margin-bottom: 4px; overflow: hidden; width: 100%;
}
.thinking-header {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  cursor: pointer; user-select: none; background: var(--color-thinking-hdr);
  font-size: 11px; font-weight: 600; color: var(--color-thinking-text);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.thinking-header .chevron { font-size: 9px; transition: transform 0.15s; }
.thinking-block.open .thinking-header .chevron { transform: rotate(90deg); }
.thinking-body {
  display: none; padding: 8px 10px 10px;
  font-size: 12px; color: var(--color-thinking-text); font-style: italic;
  line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  max-height: 280px; overflow-y: auto;
}
.thinking-block.open .thinking-body { display: block; }

/* ── Sidebar action buttons ── */
.sidebar-actions { display: flex; flex-direction: column; gap: 5px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--color-border-tertiary); }
.side-btn {
  width: 100%; padding: 6px 8px; font-size: 11px; text-align: center;
  border: 1px solid var(--color-border-tertiary); border-radius: 6px;
  background: var(--color-background-primary); color: var(--color-text-primary);
  cursor: pointer; text-decoration: none; display: block;
}
.side-btn:hover { background: var(--color-background-tertiary); }
.side-btn.danger { border-color: var(--color-error); color: var(--color-error); }
.side-btn.danger:hover { background: var(--color-background-tertiary); }

/* ── Deep Reasoning button ── */
#thinking-toggle {
  padding: 9px 12px; background: var(--color-background-primary); color: var(--color-text-secondary);
  border: 1px solid var(--color-border-tertiary); border-radius: var(--radius);
  font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; align-self: flex-end;
}
#thinking-toggle:hover { background: var(--color-background-tertiary); }
#thinking-toggle.active { background: #6b04a8; color: #fff; border-color: #6b04a8; }
#thinking-toggle.active:hover { background: #560d8a; }
</style>
</head>
<body>

<header>
  <img id="header-logo" src="/static/icon-light.png" alt="Waterworks AI">
  <h1>Waterworks AI</h1>
  <label for="model-select" style="font-size:13px;color:var(--color-text-secondary);white-space:nowrap;">Model:</label>
  <select id="model-select"><option>Loading…</option></select>
</header>

<main>
  <div id="chat-pane">
    <div id="messages"></div>
    <div id="input-area">
      <div id="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask about the water treatment plant…"></textarea>
        <button id="thinking-toggle" onclick="toggleThinking()" title="Enable extended reasoning (Opus 4.7)">Deep Reasoning</button>
        <button id="send-btn">Send</button>
      </div>
      <div id="fault-row">
        <label>Fault:</label>
        <select id="fault-target">
          <option value="RawWater_01">RawWater_01</option>
          <option value="RawWater_02">RawWater_02</option>
          <option value="HighService_01">HighService_01</option>
          <option value="HighService_02">HighService_02</option>
          <option value="Clarifier_01">Clarifier_01</option>
          <option value="FinishedWater_01">FinishedWater_01</option>
          <option value="UV_01">UV_01</option>
          <option value="UV_02">UV_02</option>
        </select>
        <select id="fault-mode">
          <option value="suction_starvation">Suction Starvation</option>
          <option value="run_status_fault">Run Status Fault</option>
          <option value="pressure_drift">Pressure Drift</option>
          <option value="cavitation">Cavitation</option>
        </select>
        <button class="fault-btn" onclick="injectFault()">Inject</button>
        <button class="fault-btn danger" onclick="clearFault()">Clear</button>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <div class="sidebar-section">
      <h2>Server Status</h2>
      <div class="health-item"><div class="dot" id="dot-aggregator"></div><span>MCP Aggregator</span></div>
      <div class="health-item"><div class="dot" id="dot-influxdb"></div><span>InfluxDB</span></div>
      <div class="health-item"><div class="dot" id="dot-mqtt"></div><span>MQTT Broker</span></div>
      <div class="health-item"><div class="dot" id="dot-simulator"></div><span>Simulator</span></div>
    </div>
    <div class="sidebar-section">
      <h2>Fault Status</h2>
      <div id="fault-status-list"><div style="color:var(--color-text-secondary);font-size:12px">Loading…</div></div>
    </div>
    <div class="sidebar-actions">
      <button class="side-btn" onclick="newConversation()">New Conversation</button>
      <a class="side-btn" href="http://localhost:3000/dashboards" target="_blank">Dashboards</a>
      <a class="side-btn" href="/audit" target="_blank">Audit Log</a>
      <a class="side-btn" href="/metrics" target="_blank">Metrics</a>
      <button class="side-btn danger" onclick="clearAuditLog()">Clear Audit Log</button>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
