<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterworks AI</title>
<style>
:root {
  --color-background-primary:   #ffffff;
  --color-background-secondary: #f4f4f5;
  --color-background-tertiary:  #e4e4e7;
  --color-text-primary:         #18181b;
  --color-text-secondary:       #71717a;
  --color-border-tertiary:      #d4d4d8;
  --color-accent:               #2563eb;
  --color-accent-hover:         #1d4ed8;
  --color-user-bubble:          #2563eb;
  --color-user-text:            #ffffff;
  --color-tool-bg:              #f0f9ff;
  --color-tool-border:          #bae6fd;
  --color-tool-header:          #0369a1;
  --color-error:                #dc2626;
  --color-ok:                   #16a34a;
  --color-warn:                 #d97706;
  --radius:                     10px;
  --font-mono:                  "SF Mono", "Fira Code", "Consolas", monospace;
  --font-sans:                  system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary:   #09090b;
    --color-background-secondary: #18181b;
    --color-background-tertiary:  #27272a;
    --color-text-primary:         #fafafa;
    --color-text-secondary:       #a1a1aa;
    --color-border-tertiary:      #3f3f46;
    --color-accent:               #3b82f6;
    --color-accent-hover:         #60a5fa;
    --color-user-bubble:          #1d4ed8;
    --color-tool-bg:              #0c1a2e;
    --color-tool-border:          #1e40af;
    --color-tool-header:          #93c5fd;
    --color-error:                #f87171;
    --color-ok:                   #4ade80;
    --color-warn:                 #fbbf24;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  flex-shrink: 0;
}
header h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
}
#model-select {
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--color-border-tertiary);
  border-radius: 6px;
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  cursor: pointer;
  max-width: 220px;
}
.health-dots { display: flex; gap: 6px; align-items: center; }
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--color-background-tertiary);
  transition: background 0.3s;
  cursor: default;
}
.dot[title] { cursor: help; }
.dot.ok   { background: var(--color-ok); }
.dot.error { background: var(--color-error); }
.dot.warn  { background: var(--color-warn); }

/* ── Main layout ── */
main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Chat pane ── */
#chat-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.message { display: flex; flex-direction: column; max-width: 80%; }
.message.user   { align-self: flex-end; align-items: flex-end; }
.message.assistant { align-self: flex-start; align-items: flex-start; }
.bubble {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .bubble {
  background: var(--color-user-bubble);
  color: var(--color-user-text);
  border-bottom-right-radius: 3px;
}
.message.assistant .bubble {
  background: var(--color-background-secondary);
  border: 1px solid var(--color-border-tertiary);
  border-bottom-left-radius: 3px;
  color: var(--color-text-primary);
}
.message.assistant .bubble:empty::after {
  content: "▋";
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Tool call blocks ── */
.tool-block {
  margin-top: 8px;
  border: 1px solid var(--color-tool-border);
  border-radius: 6px;
  background: var(--color-tool-bg);
  font-family: var(--font-mono);
  font-size: 11.5px;
  overflow: hidden;
  max-width: 600px;
}
.tool-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  cursor: pointer;
  color: var(--color-tool-header);
  user-select: none;
  font-weight: 600;
}
.tool-header:hover { opacity: 0.8; }
.tool-chevron { font-size: 9px; transition: transform 0.15s; }
.tool-chevron.open { transform: rotate(90deg); }
.tool-body { padding: 8px 10px; border-top: 1px solid var(--color-tool-border); display: none; }
.tool-body.open { display: block; }
.tool-label { font-size: 10px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.tool-content { white-space: pre-wrap; word-break: break-all; color: var(--color-text-primary); }

/* ── Input area ── */
#input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}
#input-row { display: flex; gap: 8px; }
#user-input {
  flex: 1;
  resize: none;
  padding: 9px 12px;
  font-family: var(--font-sans);
  font-size: 14px;
  border: 1px solid var(--color-border-tertiary);
  border-radius: var(--radius);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  line-height: 1.5;
  min-height: 42px;
  max-height: 160px;
  overflow-y: auto;
}
#user-input:focus { outline: 2px solid var(--color-accent); outline-offset: -1px; }
#send-btn {
  padding: 9px 18px;
  background: var(--color-accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  align-self: flex-end;
}
#send-btn:hover:not(:disabled) { background: var(--color-accent-hover); }
#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Fault panel ── */
#fault-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
#fault-row label { font-size: 11px; color: var(--color-text-secondary); }
#fault-target, #fault-mode {
  font-size: 11px;
  padding: 3px 7px;
  border: 1px solid var(--color-border-tertiary);
  border-radius: 5px;
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  cursor: pointer;
}
.fault-btn {
  font-size: 11px;
  padding: 3px 10px;
  border: 1px solid var(--color-border-tertiary);
  border-radius: 5px;
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  cursor: pointer;
}
.fault-btn:hover { background: var(--color-background-tertiary); }
.fault-btn.danger { border-color: var(--color-error); color: var(--color-error); }

/* ── Sidebar ── */
#sidebar {
  width: 220px;
  border-left: 1px solid var(--color-border-tertiary);
  background: var(--color-background-secondary);
  padding: 14px 12px;
  font-size: 12px;
  overflow-y: auto;
  flex-shrink: 0;
}
#sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-text-secondary); margin-bottom: 10px; }
.status-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--color-border-tertiary); }
.status-row:last-child { border-bottom: none; }
.status-name { font-family: var(--font-mono); font-size: 11px; }
.status-mode {
  font-family: var(--font-mono); font-size: 10px; padding: 1px 5px;
  border-radius: 3px; background: var(--color-background-tertiary);
}
.status-mode.fault { background: #fef3c7; color: #92400e; }
@media (prefers-color-scheme: dark) { .status-mode.fault { background: #2d1d02; color: #fbbf24; } }

@media (max-width: 700px) { #sidebar { display: none; } }
</style>
</head>
<body>

<header>
  <h1>Waterworks AI</h1>
  <select id="model-select"><option>Loading…</option></select>
  <div class="health-dots">
    <div class="dot" id="dot-aggregator" title="MCP Aggregator"></div>
    <div class="dot" id="dot-influxdb"   title="InfluxDB"></div>
    <div class="dot" id="dot-mqtt"       title="MQTT Broker"></div>
    <div class="dot" id="dot-simulator"  title="Simulator Control"></div>
  </div>
</header>

<main>
  <div id="chat-pane">
    <div id="messages"></div>
    <div id="input-area">
      <div id="input-row">
        <textarea id="user-input" rows="1" placeholder="Ask about the water treatment plant…"></textarea>
        <button id="send-btn">Send</button>
      </div>
      <div id="fault-row">
        <label>Fault:</label>
        <select id="fault-target">
          <option value="RawWater_01">RawWater_01</option>
          <option value="RawWater_02">RawWater_02</option>
          <option value="HighService_01">HighService_01</option>
          <option value="HighService_02">HighService_02</option>
          <option value="Clarifier_01">Clarifier_01</option>
          <option value="FinishedWater_01">FinishedWater_01</option>
          <option value="UV_01">UV_01</option>
          <option value="UV_02">UV_02</option>
        </select>
        <select id="fault-mode">
          <option value="suction_starvation">Suction Starvation</option>
          <option value="run_status_fault">Run Status Fault</option>
          <option value="pressure_drift">Pressure Drift</option>
          <option value="cavitation">Cavitation</option>
        </select>
        <button class="fault-btn" onclick="injectFault()">Inject</button>
        <button class="fault-btn danger" onclick="clearFault()">Clear</button>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <h2>Fault Status</h2>
    <div id="fault-status-list"><div style="color:var(--color-text-secondary)">Loading…</div></div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
