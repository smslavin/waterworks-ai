name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    name: Python — lint, security, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # mcp-servers and mcp-aggregator are not scanned

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install black bandit pytest pyyaml
          pip install -r topology-builder/requirements.txt
          pip install -r chat-ui/requirements.txt
          pip install -r simulator/requirements.txt
          pip install -r audit-mcp/requirements.txt

      - name: Check topology-builder template matches fieldworks-core reference
        run: |
          FW_VERSION=$(pip show fieldworks-core | awk '/^Version/ {print $2}')
          REF_URL="https://raw.githubusercontent.com/fieldworks-build/fieldworks-core/v${FW_VERSION}/examples/waterworks/topology_builder/water-treatment-municipal.yaml"
          curl -sf "$REF_URL" -o /tmp/reference-template.yaml || {
            echo "::error::Could not fetch reference template from fieldworks-core v${FW_VERSION} ($REF_URL). If the reference moved or was removed, update this check.";
            exit 1;
          }
          diff topology-builder/templates/water-treatment-municipal.yaml /tmp/reference-template.yaml || {
            echo "::error::topology-builder/templates/water-treatment-municipal.yaml has drifted from fieldworks-core's reference example (examples/waterworks/topology_builder/, v${FW_VERSION}). Sync intentionally, then update this check if the divergence is deliberate.";
            exit 1;
          }

      - name: black
        run: black --check --exclude "/(mcp-servers|mcp-aggregator|\.venv)/" .

      - name: bandit
        run: bandit -r . -ll --exclude ./mcp-servers,./mcp-aggregator,./.git

      - name: pytest
        run: pytest tests/ -v

  frontend:
    name: Vue — type check, lint, unit, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-ui/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chat-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --build

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run --coverage

      - name: Build
        run: npm run build-only

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test --project=chromium
        env:
          CI: true
