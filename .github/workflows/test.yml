name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    name: Python — lint, security, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false  # mcp-servers and mcp-aggregator are not scanned

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install black bandit pytest pyyaml
          pip install -r topology-builder/requirements.txt

      - name: black
        run: black --check --exclude "/(mcp-servers|mcp-aggregator|\.venv)/" .

      - name: bandit
        run: bandit -r . -ll --exclude ./mcp-servers,./mcp-aggregator,./.git

      - name: pytest
        run: pytest tests/ topology-builder/tests/ -v

  frontend:
    name: Vue — type check, lint, unit, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-ui/frontend

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chat-ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --build

      - name: Lint (oxlint)
        run: npx oxlint .

      - name: Lint (eslint)
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run --coverage

      - name: Build
        run: npm run build-only

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test --project=chromium
        env:
          CI: true
