services:

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    ports:
      - "${INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE:     setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-waterworks-admin}
      DOCKER_INFLUXDB_INIT_ORG:      ${INFLUXDB_ORG:-waterworks}
      DOCKER_INFLUXDB_INIT_BUCKET:   ${INFLUXDB_BUCKET:-waterworks}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-waterworks-dev-token}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER:          ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:      ${GRAFANA_PASSWORD:-waterworks}
      GF_AUTH_ANONYMOUS_ENABLED:       "true"
      GF_AUTH_ANONYMOUS_ORG_NAME:      "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE:      "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING:     "true"
      INFLUXDB_TOKEN:                  ${INFLUXDB_TOKEN:-waterworks-dev-token}
      INFLUXDB_ORG:                    ${INFLUXDB_ORG:-waterworks}
      INFLUXDB_BUCKET:                 ${INFLUXDB_BUCKET:-waterworks}
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  grafana-data:
