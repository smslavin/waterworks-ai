facility:
  name: WTP
  site_id: wtp
  description: Simulated municipal water treatment plant (waterworks-ai reference demo)
  timezone: America/Chicago
  units_system: metric

process_areas:
  - id: intake
    name: Intake
    description: River source with seasonal turbidity variation.
    specialist_prompt: "River source with seasonal turbidity variation. Correlate intake
      turbidity with downstream clarifier performance during spring runoff and storm events."

  - id: treatment
    name: Treatment
    description: Coagulation, filtration, chemical dosing, and UV disinfection.
    specialist_prompt: "Chlorination and UV run in series. Both barriers must be active for
      regulatory compliance. Clarifier turbidity above 4 NTU warrants investigation
      before water advances to distribution."

  - id: distribution
    name: Distribution
    description: Pumping of treated water to the distribution network.
    specialist_prompt: "Minimum 40 PSI required at discharge. HighService_02 has recurring
      pressure drift history — compare against HighService_01 before diagnosing
      transmitter vs. mechanical fault. Finished water tank level below 30% triggers
      demand-response protocol."

equipment_types:
  - id: pump
    name: Pump
    description: Centrifugal pump moving water through the process via impeller rotation.
    attributes:
      - id: flow
        name: Flow
        units: L/min
        normal_range: { min: 200, max: 450 }
      - id: pressure
        name: Pressure
        units: bar
        normal_range: { min: 3.5, max: 8.5 }
      - id: power
        name: Power
        units: kW
        normal_range: { min: 10, max: 70 }
      - id: running
        name: Running
        units: ""
        normal_range: { min: 0, max: 1, description: "boolean state: 0 = stopped, 1 = running" }
    fault_modes:
      - id: suction_starvation
        name: Suction Starvation
        severity: critical
        description: "Flow ramping to zero + erratic pressure + Running=True → suction starvation"
        affected_attributes: [flow, pressure, running]
      - id: run_status_fault
        name: Run Status Fault
        severity: warning
        description: "Flow≈0 + Power≈0 + Running=True → run-status fault"
        affected_attributes: [flow, power, running]
      - id: pressure_drift
        name: Pressure Drift
        severity: advisory
        description: "Pressure diverging progressively from expected range → pressure drift"
        affected_attributes: [pressure]
      - id: cavitation
        name: Cavitation
        severity: critical
        description: "High-frequency flow collapse + pressure spikes → cavitation"
        affected_attributes: [flow, pressure]

  - id: clarifier
    name: Clarifier
    description: Settling tank that removes suspended solids before filtration.
    attributes:
      - id: level
        name: Level
        units: "%"
        normal_range: { min: 20, max: 90 }
      - id: turbidity
        name: Turbidity
        units: NTU
        normal_range: { min: 0, max: 4 }
    fault_modes:
      - id: level_sensor_fault
        name: Level Sensor Fault
        severity: advisory
        description: "Level oscillating ±20% around baseline + other attributes normal → level sensor fault"
        affected_attributes: [level]
      - id: turbidity_spike
        name: Turbidity Spike
        severity: warning
        description: "Turbidity rising above 4 NTU → sedimentation failure or upstream contamination"
        affected_attributes: [turbidity]

  - id: storage_tank
    name: Storage Tank
    description: Stores treated water with continuous quality monitoring before distribution.
    attributes:
      - id: level
        name: Level
        units: "%"
        normal_range: { min: 20, max: 90 }
      - id: turbidity
        name: Turbidity
        units: NTU
        normal_range: { min: 0, max: 1 }
      - id: ph
        name: pH
        units: pH
        normal_range: { min: 6.5, max: 8.5 }
    fault_modes:
      - id: level_sensor_fault
        name: Level Sensor Fault
        severity: advisory
        description: "Level oscillating ±20% around baseline + other attributes normal → level sensor fault"
        affected_attributes: [level]
      - id: turbidity_spike
        name: Turbidity Spike
        severity: critical
        description: "Finished water turbidity above 1 NTU → treatment failure or contamination"
        affected_attributes: [turbidity]

  - id: chemical_dosing_pump
    name: Dosing
    description: Delivers chemical treatment agents at controlled flow rates.
    attributes:
      - id: flow_rate
        name: FlowRate
        units: L/h
        normal_range: { min: 4.5, max: 5.5 }
      - id: tank_level
        name: TankLevel
        units: "%"
        normal_range: { min: 10, max: 100 }
      - id: running
        name: Running
        units: ""
        normal_range: { min: 0, max: 1, description: "boolean state: 0 = stopped, 1 = running" }
    fault_modes:
      - id: dosing_blockage
        name: Dosing Blockage
        severity: critical
        description: "FlowRate ramping to zero + Running=True + TankLevel normal → discharge blockage"
        affected_attributes: [flow_rate, running]
      - id: tank_empty
        name: Tank Empty
        severity: warning
        description: "TankLevel depleting toward zero + FlowRate dropping → chemical tank empty"
        affected_attributes: [tank_level, flow_rate]
      - id: run_status_fault
        name: Run Status Fault
        severity: warning
        description: "FlowRate≈0 + Running=True + TankLevel not depleting → run-status fault"
        affected_attributes: [flow_rate, running]

  - id: uv_bank
    name: UV
    description: Provides UV disinfection of treated water before distribution.
    attributes:
      - id: intensity
        name: Intensity
        units: "%"
        normal_range: { min: 80, max: 100 }
      - id: lamp_hours
        name: LampHours
        units: hrs
        normal_range: { min: 0, max: 9000 }
      - id: running
        name: Running
        units: ""
        normal_range: { min: 0, max: 1, description: "boolean state: 0 = stopped, 1 = running" }
    fault_modes:
      - id: lamp_degradation
        name: Lamp Degradation
        severity: advisory
        description: "Intensity gradually decreasing over hours + LampHours accumulating → lamp degradation"
        affected_attributes: [intensity, lamp_hours]
      - id: lamp_failure
        name: Lamp Failure
        severity: critical
        description: "Intensity near zero immediately + Running=True → lamp failure"
        affected_attributes: [intensity, running]

equipment_instances:
  - id: raw_water_pump_1
    name: RawWater_01
    type_id: pump
    process_area_id: intake
    tag_bindings:
      flow: Plant/WTP/Pump/RawWater_01/Flow
      pressure: Plant/WTP/Pump/RawWater_01/Pressure
      power: Plant/WTP/Pump/RawWater_01/Power
      running: Plant/WTP/Pump/RawWater_01/Running

  - id: raw_water_pump_2
    name: RawWater_02
    type_id: pump
    process_area_id: intake
    tag_bindings:
      flow: Plant/WTP/Pump/RawWater_02/Flow
      pressure: Plant/WTP/Pump/RawWater_02/Pressure
      power: Plant/WTP/Pump/RawWater_02/Power
      running: Plant/WTP/Pump/RawWater_02/Running

  - id: high_service_pump_1
    name: HighService_01
    type_id: pump
    process_area_id: distribution
    tag_bindings:
      flow: Plant/WTP/Pump/HighService_01/Flow
      pressure: Plant/WTP/Pump/HighService_01/Pressure
      power: Plant/WTP/Pump/HighService_01/Power
      running: Plant/WTP/Pump/HighService_01/Running

  - id: high_service_pump_2
    name: HighService_02
    type_id: pump
    process_area_id: distribution
    notes: "Recurring pressure drift history — compare against HighService_01 before diagnosing transmitter vs. mechanical fault."
    tag_bindings:
      flow: Plant/WTP/Pump/HighService_02/Flow
      pressure: Plant/WTP/Pump/HighService_02/Pressure
      power: Plant/WTP/Pump/HighService_02/Power
      running: Plant/WTP/Pump/HighService_02/Running

  - id: clarifier_1
    name: Clarifier_01
    type_id: clarifier
    process_area_id: treatment
    tag_bindings:
      level: Plant/WTP/Clarifier/Clarifier_01/Level
      turbidity: Plant/WTP/Clarifier/Clarifier_01/Turbidity

  - id: finished_water_1
    name: FinishedWater_01
    type_id: storage_tank
    process_area_id: distribution
    notes: "Finished water tank level below 30% triggers demand-response protocol."
    tag_bindings:
      level: Plant/WTP/StorageTank/FinishedWater_01/Level
      turbidity: Plant/WTP/StorageTank/FinishedWater_01/Turbidity
      ph: Plant/WTP/StorageTank/FinishedWater_01/pH

  - id: chlorine_1
    name: Chlorine_01
    type_id: chemical_dosing_pump
    process_area_id: treatment
    tag_bindings:
      flow_rate: Plant/WTP/Dosing/Chlorine_01/FlowRate
      tank_level: Plant/WTP/Dosing/Chlorine_01/TankLevel
      running: Plant/WTP/Dosing/Chlorine_01/Running

  - id: fluoride_1
    name: Fluoride_01
    type_id: chemical_dosing_pump
    process_area_id: treatment
    tag_bindings:
      flow_rate: Plant/WTP/Dosing/Fluoride_01/FlowRate
      tank_level: Plant/WTP/Dosing/Fluoride_01/TankLevel
      running: Plant/WTP/Dosing/Fluoride_01/Running

  - id: uv_1
    name: UV_01
    type_id: uv_bank
    process_area_id: treatment
    tag_bindings:
      intensity: Plant/WTP/UV/UV_01/Intensity
      lamp_hours: Plant/WTP/UV/UV_01/LampHours
      running: Plant/WTP/UV/UV_01/Running

  - id: uv_2
    name: UV_02
    type_id: uv_bank
    process_area_id: treatment
    tag_bindings:
      intensity: Plant/WTP/UV/UV_02/Intensity
      lamp_hours: Plant/WTP/UV/UV_02/LampHours
      running: Plant/WTP/UV/UV_02/Running

historian:
  default_lookback_hours: 24
  max_lookback_days: 90

# ── Waterworks-ai extensions ──────────────────────────────────────────────────
# Everything below is ignored by fieldworks.topology.load() (Pydantic ignores
# unrecognized top-level keys) — read directly by waterworks-ai's own code.
# Not part of the fieldworks-core spec.

specialists:
  historian:
    data_sources: [influxdb, memory]
    role: historical_only

insight_categories:
  - id: fault_pattern
    label: "Fault pattern"
    target: graph_observation
  - id: maintenance_flag
    label: "Maintenance flag"
    target: work_item
    requires_review: true
  - id: false_positive
    label: "False positive"
    target: confidence_feedback
  - id: baseline_shift
    label: "Baseline shift"
    target: graph_observation
  - id: operator_note
    label: "Operator note"
    target: specialist_memory
